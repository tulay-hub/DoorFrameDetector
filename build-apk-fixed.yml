name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: |
          platform-tools
          platforms;android-34
          build-tools;34.0.0

    - name: Check for Gradle wrapper
      id: check_gradlew
      run: |
        if [ -f "./gradlew" ]; then
          echo "gradlew=true" >> $GITHUB_OUTPUT
          chmod +x ./gradlew
        else
          echo "gradlew=false" >> $GITHUB_OUTPUT
        fi

    - name: Install Gradle (if no wrapper)
      if: steps.check_gradlew.outputs.gradlew == 'false'
      run: |
        curl -sLO https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle-8.7-bin.zip
        export GRADLE_HOME=$PWD/gradle-8.7
        echo "GRADLE_HOME=$GRADLE_HOME" >> $GITHUB_ENV
        echo "$GRADLE_HOME/bin" >> $GITHUB_PATH

    - name: Build APK with wrapper
      if: steps.check_gradlew.outputs.gradlew == 'true'
      run: ./gradlew assembleRelease

    - name: Build APK with installed Gradle
      if: steps.check_gradlew.outputs.gradlew == 'false'
      run: gradle assembleRelease

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: door-frame-detector-apk
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error

    - name: Upload debug APK (backup)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: door-frame-detector-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release (on push to main)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}